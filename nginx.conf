# ─── BridgePort OS Nginx 站点配置 ───
# 用法（详见 DEPLOY.md）：
#   sudo cp nginx.conf /etc/nginx/sites-available/bridgeport-os
#   sudo ln -s /etc/nginx/sites-available/bridgeport-os /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 部署路径约定：项目放在 /var/www/bridgeport-os，结构如下
#   /var/www/bridgeport-os/frontend/dist   ← 前端打包产物（npm run build 生成）
#   /var/www/bridgeport-os/backend          ← 后端源码（PM2 启动 app.js，监听 3000）

server {
    listen 80;
    listen [::]:80;

    # 有域名时把下行改成你的域名，例如 bridgeport.example.com
    server_name _;

    # 前端静态资源
    root /var/www/bridgeport-os/frontend/dist;
    index index.html;

    # ── gzip 压缩，减小首屏体积 ──
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;

    # ── 静态资源缓存（带 hash 的文件名可长期缓存）──
    location ~* \.(?:js|css|woff2?|ttf|png|jpg|jpeg|gif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── 反向代理：所有 /api 请求转发到 Express 后端 ──
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 后端若未来引入上传/长连接，避免 60s 超时
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── Vue Router history 模式：刷新子路由时回落到 index.html ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 安全头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
